name: Build Android APK

# Compila o app Android (Capacitor) e disponibiliza o .apk pra download como
# artefato do workflow — não precisa de Android Studio local pra testar.
# Roda sozinho em PRs (pra validar antes de mergear) e a cada mudança
# relevante na branch principal; "workflow_dispatch" só fica disponível pra
# disparo manual depois que este arquivo existir na branch padrão.
on:
  push:
    branches: [main]
    paths: &paths_relevantes
      - 'app.js'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icons/**'
      - 'android/**'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths: *paths_relevantes
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Sincronizar site (www/) e assets nativos
        run: npm run cap:sync

      - name: Compilar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: atendimentos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
